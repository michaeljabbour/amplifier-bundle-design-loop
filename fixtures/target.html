<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synergize — Workflow Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
      background: #FAF9F6;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      padding: 24px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EAE7E1;
    }

    .logo {
      font-family: 'Lora', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    nav a {
      text-decoration: none;
      color: #666;
      font-size: 15px;
      margin-left: 32px;
    }

    nav a:last-child {
      color: #1a1a1a;
      font-weight: 500;
    }

    .hero {
      max-width: 820px;
      margin: 0 auto;
      padding: 96px 48px 120px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #B8612A;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 54px;
      font-weight: 600;
      line-height: 1.14;
      letter-spacing: -0.025em;
      color: #111;
      margin-bottom: 28px;
      max-width: 680px;
    }

    .subhead {
      font-size: 18px;
      line-height: 1.65;
      color: #5A5A5A;
      max-width: 520px;
      margin-bottom: 44px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-block;
      padding: 13px 26px;
      background: #B8612A;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-radius: 3px;
    }

    .btn-ghost {
      color: #555;
      text-decoration: none;
      font-size: 15px;
      border-bottom: 1px solid #BBBBB0;
      padding-bottom: 2px;
    }

    .divider {
      margin-top: 88px;
      border: none;
      border-top: 1px solid #E8E4DE;
    }

    .social-proof {
      padding-top: 36px;
    }

    .proof-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #AAAAAA;
      margin-bottom: 20px;
    }

    .logos {
      display: flex;
      gap: 44px;
      align-items: center;
      flex-wrap: wrap;
    }

    .company-name {
      font-family: 'Lora', Georgia, serif;
      font-size: 15px;
      color: #C8C4BC;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo">Synergize</a>
    <nav>
      <a href="#">Product</a>
      <a href="#">Pricing</a>
      <a href="#">Docs</a>
      <a href="#">Sign in</a>
    </nav>
  </header>

  <div class="hero">
    <span class="eyebrow">Workflow automation</span>
    <h1>Connect your tools.<br>Cut the repetition.</h1>
    <p class="subhead">Synergize routes tasks between your apps automatically — so your team focuses on decisions, not data entry.</p>
    <div class="actions">
      <a href="#" class="btn-primary">Start free trial</a>
      <a href="#" class="btn-ghost">See how it works</a>
    </div>
    <hr class="divider">
    <div class="social-proof">
      <p class="proof-label">Trusted by teams at</p>
      <div class="logos">
        <span class="company-name">Stripe</span>
        <span class="company-name">Notion</span>
        <span class="company-name">Linear</span>
        <span class="company-name">Vercel</span>
      </div>
    </div>
  </div>
</body>
</html>
