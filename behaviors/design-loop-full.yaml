bundle:
  name: design-loop-full-behavior
  version: 0.2.0
  namespace_root: ..
  description: >-
    Opt-in: design-loop plus the design-intelligence agent team (the pre-0.2.1
    composition). Use only on a base bundle that does not already include
    design-intelligence (foundation does); adds 7 agent descriptions to every request.

includes:
  - bundle: design-loop:behaviors/design-loop
  - bundle: git+https://github.com/microsoft/amplifier-bundle-design-intelligence@main#subdirectory=behaviors/design-intelligence.yaml
